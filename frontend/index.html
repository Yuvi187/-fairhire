<div id="aurora">
  <div class="abl" style="width:620px;height:480px;left:-180px;top:-100px;background:radial-gradient(ellipse,rgba(0,180,216,.1),transparent 70%);animation-duration:22s;"></div>
  <div class="abl" style="width:560px;height:560px;right:-80px;top:180px;background:radial-gradient(ellipse,rgba(99,102,241,.08),transparent 70%);animation-duration:18s;animation-delay:-8s;"></div>
  <div class="abl" style="width:460px;height:400px;left:35%;bottom:-80px;background:radial-gradient(ellipse,rgba(139,92,246,.07),transparent 70%);animation-duration:25s;animation-delay:-14s;"></div>
</div>
<canvas id="ptcl"></canvas>
<div id="root"></div>

<script>
(function(){
  var c=document.getElementById('ptcl'),ctx=c.getContext('2d'),W,H,pts,N=44;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  function mk(){pts=Array.from({length:N},function(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.4,a:Math.random()*.4+.1};});}
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(0,212,255,'+p.a+')';ctx.fill();});
    for(var i=0;i<N;i++)for(var j=i+1;j<N;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle='rgba(99,102,241,'+(1-d/110)*.09+')';ctx.lineWidth=.7;ctx.stroke();}}
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',function(){resize();mk();});resize();mk();draw();
})();
</script>

<script type="text/babel">
const {useState,useEffect} = React;

// ─── IMPORTANT: Your Render backend URL ───────────────────────────────────
const BASE = 'https://fairhire-backendd.onrender.com/api';
// ─────────────────────────────────────────────────────────────────────────

// ── API helper ─────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const tk = localStorage.getItem('fh_token');
  try {
    const res = await fetch(BASE + path, {
      method: opts.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        ...(tk ? { Authorization: 'Bearer ' + tk } : {})
      },
      ...(opts.body ? { body: opts.body } : {})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
    return data;
  } catch (err) {
    if (err.message === 'Failed to fetch') {
      throw new Error('Cannot reach server. Make sure the backend is running at ' + BASE);
    }
    throw err;

}

// ── Compress image to JPEG, max 600px wide, ~80KB output ─────────────────
function compressImage(file, maxW=600, quality=0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const ratio = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
    img.src = url;
  });
}

// ── Convert file to base64 (capped to maxBytes) ───────────────────────────
function fileToB64(file, maxBytes=800000) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => {
      const data = reader.result;
      if (data.length > maxBytes * 1.4) {
        rej(new Error(`File too large (max ~${Math.round(maxBytes/1024)}KB for uploads)`));
      } else {
        res(data);
      }
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function CandidateLogin({setPage, showToast, setAuth}) {
  const [email, setEmail] = useState('');

  const [loading, setLoading] = useState(false);
  async function login() {
    if (!email||!pw) { showToast('Enter email and password','error'); return; }

  return (

// ── Gauge ──────────────────────────────────────────────────────────────────
function Gauge({label, value, color, size=68}) {
  const R=size*.38,cx=size/2,cy=size/2,circ=2*Math.PI*R,pct=Math.max(0,Math.min(100,value||0));
  return (
    <div className="gauge-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={cx} cy={cy} r={R} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth={size*.1}/>
        <circle cx={cx} cy={cy} r={R} fill="none" stroke={color} strokeWidth={size*.1}
          strokeDasharray={circ} strokeDashoffset={circ-(pct/100)*circ}
          strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}
          style={{transition:'stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)'}}/>
        <text x={cx} y={cy+5} textAnchor="middle" fill="white" fontSize={size*.19} fontWeight="700" fontFamily="Unbounded,sans-serif">{pct.toFixed(0)}</text>
      </svg>
      <div className="gauge-lbl">{label}</div>
    </div>
  );
}

// ── HR Dashboard ───────────────────────────────────────────────────────────
function HRDashboard({showToast}) {
  const [cands,setCands]=useState([]);
  const [sel,setSel]=useState(null);
  const [det,setDet]=useState(null);
  const [loading,setLoading]=useState(true);
  const [slLoad,setSlLoad]=useState(false);
  const [dlLoad,setDlLoad]=useState(false);
  const [sort,setSort]=useState('finalScore');
  const [cf,setCf]=useState('All');
  const [search,setSearch]=useState('');
  const [tab,setTab]=useState('all');
  const [slNote,setSlNote]=useState('');

  useEffect(()=>{api('/hr/candidates').then(setCands).catch(e=>showToast(e.message,'error')).finally(()=>setLoading(false));},[]);

  async function selectC(cid){setSel(cid);setDet(null);try{setDet(await api('/hr/candidate/'+cid));}catch(e){showToast(e.message,'error');}}

  async function toggleSL(cid,isShortlisted){
    setSlLoad(true);
    try{
      if(isShortlisted){await api('/hr/shortlist/'+cid,{method:'DELETE'});showToast('Removed from shortlist','success');}
      else{await api('/hr/shortlist/'+cid,{method:'POST',body:JSON.stringify({note:slNote})});showToast('✅ Shortlisted! Admin can now contact them.','success');setSlNote('');}
      const updated=await api('/hr/candidates');setCands(updated);
      if(det){const d=await api('/hr/candidate/'+cid);setDet(d);}
    }catch(e){showToast(e.message,'error');}
    setSlLoad(false);
  }

  async function dlReport(cid){
    setDlLoad(true);
    try{const tk=localStorage.getItem('fh_token');const res=await fetch(BASE+'/hr/report/'+cid,{headers:{Authorization:'Bearer '+tk}});if(!res.ok)throw new Error('Report failed');const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='FairHire_'+cid+'.pdf';a.click();URL.revokeObjectURL(url);showToast('PDF downloaded!','success');}
    catch(e){showToast(e.message,'error');}
    setDlLoad(false);
  }

  const list=[...cands].filter(c=>cf==='All'||c.confidenceLevel===cf).filter(c=>!search||c.candidateId.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(b[sort]||0)-(a[sort]||0));
  const show=tab==='shortlisted'?list.filter(c=>c.isShortlisted):list;
  const st={total:cands.length,high:cands.filter(c=>c.confidenceLevel==='High').length,sl:cands.filter(c=>c.isShortlisted).length,avg:cands.length?+(cands.reduce((a,c)=>a+(c.finalScore||0),0)/cands.length).toFixed(1):0};

  return (
    <div className="page">
      <div className="ctr">
        <div className="row jb wrap g12 mb16 fu">
          <div><h1 className="ub" style={{fontSize:21,fontWeight:900}}>HR Dashboard</h1><p className="tm mt4" style={{fontSize:13}}>All identities anonymized. Shortlist candidates for Admin to contact.</p></div>
          <div className="row g7 wrap">
            <input className="inp" placeholder="Search ID…" style={{width:120,padding:'7px 11px',fontSize:12}} value={search} onChange={e=>setSearch(e.target.value)}/>
            <select className="inp" style={{width:112,fontSize:12,padding:'7px 11px'}} value={cf} onChange={e=>setCf(e.target.value)}><option>All</option><option>High</option><option>Medium</option><option>Low</option></select>
            <select className="inp" style={{width:155,fontSize:12,padding:'7px 11px'}} value={sort} onChange={e=>setSort(e.target.value)}><option value="finalScore">↓ Final Score</option><option value="academicScore">↓ Academic</option><option value="skillScore">↓ Skills</option></select>
          </div>
        </div>
        <div className="g4 mb14 fu d1">
          {[{l:'Total',v:st.total,c:'var(--cyan)',li:'linear-gradient(90deg,var(--cyan),var(--indigo))'},{l:'High Confidence',v:st.high,c:'var(--green)',li:'var(--green)'},{l:'Shortlisted',v:st.sl,c:'var(--amber)',li:'var(--amber)'},{l:'Avg Score',v:st.avg,c:'#c4b5fd',li:'linear-gradient(90deg,var(--violet),var(--pink))'}].map(s=>(
            <div key={s.l} className="card sc"><div className="grid-bg"/><div className="sc-n" style={{color:s.c,fontSize:22}}>{s.v}</div><div className="sc-l">{s.l}</div><div className="sc-line" style={{background:s.li}}/></div>
          ))}
        </div>
        <div className="tabs fu d2">
          <button className={`tab ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>All Candidates ({cands.length})</button>
          <button className={`tab ${tab==='shortlisted'?'active':''}`} onClick={()=>setTab('shortlisted')}>⭐ Shortlisted ({st.sl})</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:sel?'1fr 345px':'1fr',gap:13,alignItems:'start'}}>
          <div className="card fu d2" style={{overflow:'hidden'}}>
            {loading?<div style={{padding:48,textAlign:'center'}}><span className="sp" style={{width:26,height:26,borderWidth:3,margin:'auto'}}/></div>
              :show.length===0?<div style={{padding:48,textAlign:'center',color:'var(--muted)'}}>No candidates found.</div>
              :<table className="tbl">
                <thead><tr><th></th><th>ID</th><th>10th</th><th>12th</th><th>CGPA</th><th>Skills</th><th>Exp</th><th>Score</th><th>Conf</th><th>Actions</th></tr></thead>
                <tbody>
                  {show.map(c=>(
                    <tr key={c.candidateId} onClick={()=>selectC(c.candidateId)} className={`${sel===c.candidateId?'sel':''} ${c.isShortlisted?'sl-row':''}`}>
                      <td>{c.isShortlisted&&<span className="sl-dot"/>}</td>
                      <td><strong className="ub tc" style={{fontSize:11.5}}>{c.candidateId}</strong></td>
                      <td>{c.tenthPercentage??'—'}%</td><td>{c.twelfthPercentage??'—'}%</td>
                      <td><strong>{c.cgpa??'—'}</strong></td>
                      <td><div style={{display:'flex',flexWrap:'wrap',gap:3}}>{(c.skills||[]).slice(0,2).map(s=><span key={s.name} style={{fontSize:10,padding:'1px 6px',borderRadius:5,fontWeight:600,background:s.verified?'rgba(16,185,129,.1)':'rgba(245,158,11,.1)',color:s.verified?'var(--green)':'var(--amber)'}}>{s.name} {s.verified?'✓':'⚠'}</span>)}{(c.skills?.length||0)>2&&<span style={{fontSize:10,color:'var(--muted)'}}>+{c.skills.length-2}</span>}</div></td>
                      <td>{c.experienceYears??0}yr</td>
                      <td><strong className="ub" style={{fontSize:12.5,color:(c.finalScore||0)>=75?'var(--green)':(c.finalScore||0)>=50?'var(--amber)':'var(--red)'}}>{c.finalScore?.toFixed(1)??'—'}</strong></td>
                      <td><span className={`badge ${c.confidenceLevel==='High'?'b-green':c.confidenceLevel==='Medium'?'b-amber':'b-red'}`} style={{fontSize:9.5}}>{c.confidenceLevel||'—'}</span></td>
                      <td onClick={e=>e.stopPropagation()}>
                        <div className="row g6">
                          <button className={`btn btn-xs ${c.isShortlisted?'btn-danger':'btn-green'}`} onClick={()=>toggleSL(c.candidateId,c.isShortlisted)} disabled={slLoad}>{c.isShortlisted?'✕ Remove':'⭐ Select'}</button>
                          <button className="btn btn-glass btn-xs" onClick={()=>dlReport(c.candidateId)} disabled={dlLoad}>⬇</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            }
          </div>
          {sel&&(
            <div className="card slr" style={{padding:20,position:'sticky',top:78}}>
              <div className="row jb mb10"><div><div style={{fontSize:10,color:'var(--muted)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:2}}>Candidate</div><strong className="ub tc" style={{fontSize:13.5}}>{sel}</strong></div><button className="btn btn-glass btn-xs" onClick={()=>{setSel(null);setDet(null);}}>✕</button></div>
              <div className="hdiv" style={{margin:'8px 0'}}/>
              {!det?<div style={{textAlign:'center',padding:34}}><span className="sp" style={{width:24,height:24,margin:'auto'}}/></div>:(<>
                {det.score&&(<><div className="fdisp mb12"><div className="ub fnum" style={{fontSize:36,color:det.score.confidence_level==='High'?'var(--green)':det.score.confidence_level==='Medium'?'var(--amber)':'var(--red)'}}>{det.score.final_score?.toFixed(1)}</div><div style={{fontSize:10.5,color:'var(--muted)',marginTop:2}}>Final / 100</div><span className={`badge ${det.score.confidence_level==='High'?'b-green':det.score.confidence_level==='Medium'?'b-amber':'b-red'}`} style={{marginTop:7,display:'inline-flex'}}>{det.score.confidence_level}</span></div><div style={{display:'flex',justifyContent:'space-around',gap:6,marginBottom:12}}><Gauge label="Academic" value={det.score.academic_score} color="var(--cyan)" size={56}/><Gauge label="Skills" value={det.score.skill_score} color="var(--violet)" size={56}/><Gauge label="Exp" value={det.score.experience_score} color="var(--amber)" size={56}/></div></>)}
                {det.qualifications&&(<><div className="slbl s-cyan" style={{fontSize:10,marginBottom:7}}>Academic</div><div className="g2" style={{gap:6,marginBottom:11}}>{[['10th',det.qualifications.tenth_percentage+'%'],['12th',det.qualifications.twelfth_percentage+'%'],['CGPA',det.qualifications.cgpa],['Degree',det.qualifications.degree]].map(([k,v])=><div key={k} style={{padding:'6px 9px',background:'rgba(255,255,255,.04)',borderRadius:7}}><div style={{fontSize:9,color:'var(--muted)',marginBottom:1,textTransform:'uppercase',letterSpacing:'.05em'}}>{k}</div><div style={{fontSize:12.5,fontWeight:600}}>{v||'—'}</div></div>)}</div></>)}
                {det.skills?.length>0&&(<><div className="slbl s-cyan" style={{fontSize:10,marginBottom:7}}>Skills</div>{det.skills.map(s=><div key={s.skill_name} className="row jb" style={{padding:'6px 9px',background:'rgba(255,255,255,.04)',borderRadius:7,marginBottom:4}}><span style={{fontSize:12.5,fontWeight:500}}>{s.skill_name}</span><div className="row g8"><span style={{fontSize:10.5,color:'var(--muted)'}}>{s.confidence?.toFixed(0)}%</span><span>{s.is_verified?'✅':'⚠️'}</span></div></div>)}</>)}
                {!det.isShortlisted&&<div style={{marginBottom:9}}><label style={{fontSize:10.5,color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Note for Admin (optional)</label><input className="inp" placeholder="e.g. Strong Python, interview ASAP" value={slNote} onChange={e=>setSlNote(e.target.value)} style={{fontSize:12.5,padding:'7px 11px'}}/></div>}
                <div className="g2" style={{gap:7}}>
                  <button className={`btn ${det.isShortlisted?'btn-danger':'btn-green'}`} style={{width:'100%',padding:'8px'}} onClick={()=>toggleSL(sel,det.isShortlisted)} disabled={slLoad}>{slLoad?<span className="sp"/>:det.isShortlisted?'✕ Remove':'⭐ Shortlist'}</button>
                  <button className="btn btn-indigo" style={{width:'100%',padding:'8px'}} onClick={()=>dlReport(sel)} disabled={dlLoad}>{dlLoad?<span className="sp"/>:'⬇ PDF'}</button>
                </div>
                {det.isShortlisted&&<div className="notice n-green mt8" style={{fontSize:11}}>✅ Shortlisted. Admin can now see contact details and reach out.</div>}
              </>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                  </div></>
                )}
                {det.qualifications&&(<><div className="slbl s-violet" style={{fontSize:10,marginBottom:7}}>Full Qualifications</div><div className="g2" style={{gap:5,marginBottom:10}}>{[['10th%',det.qualifications.tenth_percentage+'%'],['12th%',det.qualifications.twelfth_percentage+'%'],['CGPA',det.qualifications.cgpa],['Degree',det.qualifications.degree],['Branch',det.qualifications.branch],['College',det.qualifications.college_name||'—'],['School',det.qualifications.school_name||'—']].map(([k,v])=><div key={k} style={{padding:'5px 8px',background:'rgba(255,255,255,.04)',borderRadius:6}}><div style={{fontSize:8.5,color:'var(--muted)',marginBottom:1,textTransform:'uppercase',letterSpacing:'.05em'}}>{k}</div><div style={{fontSize:12,fontWeight:600}}>{v||'—'}</div></div>)}</div></>)}
                {det.documents?.length>0&&(<><div className="slbl s-orange" style={{fontSize:10,marginBottom:7}}>Documents ({det.documents.length})</div>{det.documents.map((d,i)=><div key={i} className="doc-item"><span style={{fontSize:18}}>📄</span><div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:600}}>{d.name}</div><div style={{fontSize:10.5,color:'var(--muted)'}}>{d.uploadedAt?.slice(0,10)||'—'}</div></div>{d.data&&<button className="btn btn-glass btn-xs" onClick={()=>{const a=document.createElement('a');a.href=d.data;a.download=d.name+'.pdf';a.click();}}>⬇</button>}</div>)}</>)}
                {det.skills?.length>0&&(<><div className="slbl s-cyan" style={{fontSize:10,marginBottom:7,marginTop:8}}>Skills</div>{det.skills.map(s=><div key={s.skill_name} className="row jb" style={{padding:'5px 9px',background:'rgba(255,255,255,.04)',borderRadius:7,marginBottom:4}}><span style={{fontSize:12,fontWeight:500}}>{s.skill_name}</span><div className="row g8"><span style={{fontSize:10,color:'var(--muted)'}}>{s.confidence?.toFixed(0)}%</span><span>{s.is_verified?'✅':'⚠️'}</span></div></div>)}</>)}
                {det.experience?.length>0&&(<><div className="slbl s-amber" style={{fontSize:10,marginBottom:7,marginTop:8}}>Experience (with Company)</div>{det.experience.map((e,i)=><div key={i} className="ecrd"><div className="row jb"><span style={{fontSize:12.5,fontWeight:600}}>{e.role||'—'}</span><span className="ta ub fw7" style={{fontSize:11}}>{e.duration_months}m</span></div>{e.company_name&&<div style={{fontSize:11.5,color:'var(--amber)',marginTop:2}}>🏢 {e.company_name}</div>}{e.description&&<div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{e.description}</div>}</div>)}</>)}
                {det.score&&(<><div className="slbl s-green" style={{fontSize:10,marginBottom:7,marginTop:8}}>Score</div><div style={{padding:'10px 12px',background:'rgba(0,212,255,.05)',border:'1px solid rgba(0,212,255,.12)',borderRadius:9}}>{[['Final Score',det.score.final_score?.toFixed(1)+' / 100'],['Confidence',det.score.confidence_level],['Academic',det.score.academic_score?.toFixed(1)],['Skills',det.score.skill_score?.toFixed(1)]].map(([k,v])=><div key={k} className="row jb" style={{padding:'3px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}><span style={{fontSize:11,color:'var(--muted)'}}>{k}</span><strong style={{fontSize:11.5,fontFamily:'Unbounded,sans-serif',color:'var(--cyan)'}}>{v}</strong></div>)}</div></>)}
              </>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── App Root ───────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]      = useState('landing');
  const [token, setToken]    = useState(localStorage.getItem('fh_token'));
  const [userType, setUType] = useState(localStorage.getItem('fh_type'));
  const [toast, setToast]    = useState(null);
  function setAuth(t, type) { setToken(t); setUType(type); }
  function logout() { ['fh_token','fh_type','fh_cid'].forEach(k=>localStorage.removeItem(k)); setToken(null); setUType(null); setPage('landing'); }
  function showToast(msg, type='success') { setToast({msg,type,key:Date.now()}); }
  const P = {setPage,showToast,setAuth,token,userType};
  return (<>
    <Nav page={page} setPage={setPage} token={token} userType={userType} onLogout={logout}/>
    {page==='landing'             && <Landing {...P}/>}
    {page==='candidate-register'  && <CandidateRegister {...P}/>}
    {page==='candidate-login'     && <CandidateLogin {...P}/>}
    {page==='candidate-dashboard' && <CandidateDashboard {...P}/>}
    {page==='hr-login'            && <HRLogin {...P}/>}
    {page==='hr-dashboard'        && <HRDashboard {...P}/>}
    {page==='admin-login'         && <AdminLogin {...P}/>}
    {page==='admin-dashboard'     && <AdminDashboard {...P}/>}
    {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onClose={() => setToast(null)}/>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
